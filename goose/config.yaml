# Cloud Run Goose config. Desktop extensions stay listed so Extension Manager
# can enable them on demand. Heavy npx/uvx MCPs default off.
# Keep always-on extensions at 4 so one task MCP stays within Goose's
# recommended 5-extension / 50-tool limit (docs/mcp/extension-manager-mcp).
extensions:
  computercontroller:
    enabled: false
    type: builtin
    name: computercontroller
    description: General computer control tools that don't require you to be a developer or engineer.
    display_name: Computer Controller
    timeout: 300
    bundled: true
  apps:
    enabled: false
    type: platform
    name: apps
    description: Create and manage custom Goose apps through chat. Apps are HTML/CSS/JavaScript and run in sandboxed windows.
    display_name: Apps
    bundled: true
  code_execution:
    enabled: false
    type: platform
    name: code_execution
    description: Disabled so cloud Goose calls developer tools directly. Code Mode was emitting shell calls without a command field.
    display_name: Code Mode
    bundled: true
  skills:
    enabled: false
    type: platform
    name: skills
    description: Off so always-on stays under 5 extensions. No project skills in this image.
    display_name: Skills
    bundled: true
  scheduler:
    enabled: false
    type: platform
    name: scheduler
    description: Disabled on Cloud Run. Buzz YAML on:schedule is the scheduler.
    display_name: Scheduler
    bundled: true
  extensionmanager:
    enabled: true
    type: platform
    name: Extension Manager
    description: Enable extension management tools for discovering, enabling, and disabling extensions
    display_name: Extension Manager
    bundled: true
  developer:
    enabled: true
    type: platform
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    bundled: true
  orchestrator:
    enabled: false
    type: platform
    name: orchestrator
    description: 'Manage agent sessions: list, view, start, send messages, interrupt, and stop agents'
    display_name: Orchestrator
    bundled: true
  tom:
    enabled: true
    type: platform
    name: tom
    description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
    display_name: Top Of Mind
    bundled: true
  summon:
    enabled: false
    type: platform
    name: summon
    description: Load knowledge and delegate tasks to subagents
    display_name: Summon
    bundled: true
  chatrecall:
    enabled: false
    type: platform
    name: chatrecall
    description: Search past conversations and load session summaries for contextual memory
    display_name: Chat Recall
    bundled: true
  summarize:
    enabled: false
    type: platform
    name: summarize
    description: Load files/directories and get an LLM summary in a single call
    display_name: Summarize
    bundled: true
  analyze:
    enabled: false
    type: platform
    name: analyze
    description: 'Analyze code structure with tree-sitter: directory overviews, file details, symbol call graphs'
    display_name: Analyze
    bundled: true
  todo:
    enabled: true
    type: platform
    name: todo
    description: Enable a todo list for goose so it can keep track of what it is doing
    display_name: Todo
    bundled: true
  autovisualiser:
    enabled: false
    type: builtin
    name: autovisualiser
    description: Data visualization and UI generation tools
    display_name: Auto Visualiser
    timeout: 300
    bundled: true
  memory:
    enabled: false
    type: builtin
    name: memory
    description: Teach goose your preferences as you go.
    display_name: Memory
    timeout: 300
    bundled: true
  tutorial:
    enabled: false
    type: builtin
    name: tutorial
    description: Access interactive tutorials and guides
    display_name: Tutorial
    timeout: 300
    bundled: true
  chromedevtools:
    enabled: false
    type: stdio
    name: Chrome DevTools
    description: Control and inspect a live Chrome browser
    cmd: npx
    args:
    - -y
    - chrome-devtools-mcp@latest
    envs: {}
    env_keys: []
    timeout: 300
    cwd: null
    bundled: null
  containeruse:
    enabled: false
    type: stdio
    name: Container Use
    description: Integrate container workflows with goose using the Container-Use MCP
    cmd: npx
    args:
    - -y
    - mcp-remote
    - https://container-use.com/mcp
    envs: {}
    env_keys: []
    timeout: 300
    cwd: null
    bundled: null
  github:
    enabled: false
    type: streamable_http
    name: GitHub
    description: GitHub repository management and operations
    uri: https://api.githubcopilot.com/mcp/
    envs: {}
    env_keys:
    - GITHUB_PERSONAL_ACCESS_TOKEN
    headers:
      Authorization: Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}
    timeout: 300
    socket: null
    bundled: null
  goosedocs:
    enabled: false
    type: stdio
    name: goose Docs
    description: GitMCP for goose documentation
    cmd: npx
    args:
    - mcp-remote
    - https://block.gitmcp.io/goose/
    envs: {}
    env_keys: []
    timeout: 300
    cwd: null
    bundled: null
  knowledgegraphmemory:
    enabled: false
    type: stdio
    name: Knowledge Graph Memory
    description: Graph-based memory system for persistent knowledge storage
    cmd: npx
    args:
    - -y
    - '@modelcontextprotocol/server-memory'
    envs: {}
    env_keys: []
    timeout: 300
    cwd: null
    bundled: null
  linuxmcpserver:
    enabled: false
    type: stdio
    name: Linux MCP Server
    description: Tools to allow LLM clients to interact with Linux systems remotely
    cmd: uvx
    args:
    - linux-mcp-server
    envs: {}
    env_keys: []
    timeout: 300
    cwd: null
    bundled: null
  playwright:
    enabled: false
    type: stdio
    name: Playwright
    description: Interact with web pages through structured accessibility snapshots using Playwright. Never use this for Google login.
    cmd: npx
    args:
    - '@playwright/mcp@latest'
    envs: {}
    env_keys: []
    timeout: 300
    cwd: null
    bundled: null
  repomix:
    enabled: false
    type: stdio
    name: Repomix
    description: Repository analysis and code organization
    cmd: npx
    args:
    - -y
    - repomix
    - --mcp
    envs: {}
    env_keys: []
    timeout: 300
    cwd: null
    bundled: null
  youtubetranscript:
    enabled: false
    type: stdio
    name: YouTube Transcript
    description: YouTube video transcript extraction
    cmd: uvx
    args:
    - --from
    - git+https://github.com/jkawamoto/mcp-youtube-transcript
    - mcp-youtube-transcript
    envs: {}
    env_keys: []
    timeout: 300
    cwd: null
    bundled: null
  tavilywebsearch:
    enabled: false
    type: stdio
    name: Tavily Web Search
    description: Web search capabilities powered by Tavily
    cmd: npx
    args:
    - -y
    - tavily-mcp
    envs: {}
    env_keys:
    - TAVILY_API_KEY
    timeout: 300
    cwd: null
    bundled: null
  stripe:
    enabled: false
    type: streamable_http
    name: Stripe
    description: Stripe hosted MCP (restricted API key as Bearer)
    uri: https://mcp.stripe.com
    timeout: 300
    envs: {}
    env_keys:
    - STRIPE_API_KEY
    headers:
      Authorization: Bearer ${STRIPE_API_KEY}
    bundled: null
  googleadc:
    enabled: false
    type: stdio
    name: Google Workspace
    description: Gmail, Drive, and Sheets via gcloud Application Default Credentials
    cmd: uv
    args:
    - run
    - --with
    - "mcp>=2"
    - --with
    - google-api-python-client
    - --with
    - google-auth
    - --with
    - google-auth-httplib2
    - python
    - /opt/buzz/local-mcp/google_adc_mcp.py
    envs: {}
    env_keys:
    - GOOGLE_CLOUD_PROJECT
    timeout: 300
    cwd: null
    bundled: null
active_provider: litellm
providers:
  litellm:
    enabled: true
    model: goose
    configured: true
GOOSE_TELEMETRY_ENABLED: false
GOOSE_THINKING_EFFORT: low
GOOSE_MODE: auto
# Cloud has no approval UI; this flag would park shell tools (including send) forever.
SECURITY_PROMPT_ENABLED: false
GOOSE_OAUTH_CALLBACK_PORT: '3334'
GOOSE_PROVIDER: litellm
GOOSE_MODEL: goose
LITELLM_HOST: http://127.0.0.1:4000
LITELLM_TIMEOUT: 120
GOOSE_DISABLE_KEYRING: '1'
